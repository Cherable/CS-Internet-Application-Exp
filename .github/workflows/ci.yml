name: Django checks
on: [push, pull_request]
jobs:
  sqlite-preview:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: 'true'
      DJANGO_SECRET_KEY: ci-local-development-only-not-for-production
      DB_ENGINE: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --verbosity 2
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-test-password
          MYSQL_DATABASE: campus_shop
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-test-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DJANGO_DEBUG: 'true'
      DJANGO_SECRET_KEY: ci-local-development-only-not-for-production
      DB_ENGINE: mysql
      MYSQL_DATABASE: campus_shop
      MYSQL_USER: root
      MYSQL_PASSWORD: ci-test-password
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config
      - run: python -m pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py test --verbosity 2
